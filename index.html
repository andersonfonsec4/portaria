<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Portaria</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <h2>🛡 Portaria</h2>
        <p>Controle de Acesso</p>
      </div>

      <nav>
        <ul>
          <li class="active">
            <a href="#" onclick="carregarDashboard()"> 🏠 Dashboard </a>
          </li>

          <li>
            <a href="#" onclick="carregarVisitantes()"> 👤 Visitantes </a>
          </li>

          <li>
            <a href="#" onclick="carregarEntregas()"> 📦 Entregas </a>
          </li>

          <li>
            <a href="#" onclick="carregarHistorico()"> 📋 Histórico </a>
          </li>

          <li>
            <a href="#" onclick="carregarConfiguracoes()"> ⚙ Configurações </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Conteúdo -->
    <div class="content">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h2 id="page-title">Dashboard</h2>

          <p>Sistema de Controle de Portaria</p>
        </div>

        <div class="header-right">
          <span id="current-date"></span>

          <span class="user-name">Anderson</span>
        </div>
      </header>

      <!-- Área dinâmica -->
      <main class="main" id="content"></main>
    </div>

    <!-- Views -->
    <script src="views/dashboard.js"></script>
    <script src="views/visitantes.js"></script>
    <script src="views/entregas.js"></script>
    <script src="views/historico.js"></script>
    <script src="views/configuracoes.js"></script>

    <!-- Aplicação -->
    <script src="js/app.js"></script>
  </body>
</html>
